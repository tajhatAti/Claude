<!-- THE stylesheet. Nine sheets (pro/emoji/classic/workbench/codestudio/
     terminal/runspace-dark/landing/nova) were replaced by this one file:
     layering a tenth sheet over them could only ever be a coat of paint,
     because 1,973 lines of classic.css and 1,959 of runspace-dark.css
     kept asserting the old shape underneath. -->
<link rel="stylesheet" href="/static/app.css?v=20260823b">
<script>
/* THEME BEFORE PAINT.
 * data-theme was only set once pro.js ran, so the very first paint used the
 * :root defaults — which are the LIGHT glass values. On a dark app that
 * rendered the dashboard's middle as a white sheet until the script caught
 * up. Setting the attribute here, inline and before any stylesheet is
 * applied, removes the window entirely.
 * Mirrors initTheme(): explicit choice > OS preference > dark. */
(function () {
  /* DARK UNLESS THE USER ASKED OTHERWISE — the OS preference is deliberately
   * NOT consulted.
   *
   * REPRODUCED: with a phone in light mode this script chose "light", which
   * is honest to the OS but wrong for this product. RunSpace and Code Studio
   * ship hardcoded dark palettes (#0d1117 / #161b22) and contain ZERO
   * data-theme rules, so they stay dark no matter what. The shared chrome
   * then rendered light glass — rgba(255,255,255,.62) — against them, and the
   * middle of the dashboard read as a white sheet.
   *
   * Following the OS only makes sense once every surface can actually follow
   * it. Until then, defaulting to dark is what matches the app the user sees;
   * an explicit choice in Settings is still honoured. */
  try {
    var t = localStorage.getItem("ahad_theme");
    document.documentElement.setAttribute(
      "data-theme", t === "light" ? "light" : "dark");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
<!-- NOVA — the design language. Loaded after every other sheet because it
     re-points the tokens each of them reads, so they adopt it without

<!-- xterm loads ON DEMAND (see _ensureXterm in terminal.js): it is 300KB+ of
     CDN payload that only matters once a terminal is opened, and in the
     Telegram webview those two blocking round-trips were a large part of the
     startup lag. Nothing else on the page needs it. -->
<!-- CodeMirror IDE Editor CSS & JS -->
<script>
  // Boot guard — prevents a flash of the wrong screen before JS decides.
  (function () {
    try {
      if (!localStorage.getItem('ahad_token')) {
        document.documentElement.classList.remove('booting');
      }
    } catch (e) {
      document.documentElement.classList.remove('booting');
    }
  })();
</script>

<script>
// Sprint0: UI helpers
(function(){
  // Demo pill: show when ?demo=1 OR running from file:// OR localhost
  function showDemoPillIfNeeded(){
    try{
      var params = new URLSearchParams(location.search);
      var pill = document.getElementById('demoPill');
      if(!pill) return;
      if(params.get('demo')==='1' || location.protocol==='file:' || location.hostname==='127.0.0.1' || location.hostname==='localhost'){
        pill.hidden = false;
      } else {
        // leave hidden — server can unhide by injecting header auth in the future
      }
    }catch(e){}
  }

  // Small snackbar
  var snackTimer = null;
  function showSnack(msg, timeout){
    var s = document.getElementById('uiSnack');
    if(!s) return;
    s.textContent = msg;
    s.style.display = 'block';
    s.style.opacity = '1';
    if(snackTimer) clearTimeout(snackTimer);
    snackTimer = setTimeout(function(){ s.style.opacity='0'; setTimeout(function(){s.style.display='none'},250); }, timeout || 3500);
  }

  // Simple modal: returns a promise resolved true if OK
  function showModal(title, body, okText, cancelText){
    return new Promise(function(resolve){
      var modal = document.getElementById('uiModal');
      var t = document.getElementById('uiModalTitle');
      var b = document.getElementById('uiModalBody');
      var ok = document.getElementById('uiModalOk');
      var cancel = document.getElementById('uiModalCancel');
      if(!modal||!t||!b||!ok||!cancel){ resolve(false); return; }
      t.textContent = title||'Confirm'; b.textContent = body||''; ok.textContent = okText||'OK'; cancel.textContent = cancelText||'Cancel';
      modal.style.display='flex'; modal.setAttribute('aria-hidden','false');
      function cleanup(){ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); ok.removeEventListener('click',onok); cancel.removeEventListener('click',oncancel); }
      function onok(){ cleanup(); resolve(true); }
      function oncancel(){ cleanup(); resolve(false); }
      ok.addEventListener('click', onok); cancel.addEventListener('click', oncancel);
    });
  }

  // Copy fingerprint button: create in header near demo pill
  function createCopyFingerprintBtn(){
    try{
      var container = document.querySelector('.dash-user') || document.querySelector('.nav-cta');
      if(!container) return;
      var btn = document.createElement('button');
      btn.id = 'copyFingerprintBtn';
      btn.className = 'copy-btn';
      btn.title = 'Copy deployed Telegram token fingerprint (health check)';
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-copy"></use></svg>';
      btn.addEventListener('click', function(){
        fetch('/health').then(function(r){ if(!r.ok) throw new Error('health failed'); return r.json(); }).then(function(j){
          var fp = j && j.telegram_token_fingerprint;
          var out = '';
          try{
            if(typeof fp === 'string') out = fp;
            else if(fp && typeof fp === 'object'){
              // common shape: {sha256_12: 'abcd...'} or {'configured': true}
              out = fp.sha256_12 || fp.sha256 || JSON.stringify(fp);
            } else out = 'not configured';
          }catch(e){ out = 'unavailable'; }
          if(!out || out==='not configured' || out==='unavailable'){
            showModal('Token fingerprint unavailable', 'The deployed token fingerprint is not configured or the server cannot reach Telegram right now.', 'OK');
            return;
          }
          navigator.clipboard.writeText(out).then(function(){ showSnack('Fingerprint copied to clipboard'); }, function(){ showSnack('Unable to copy — please copy manually: '+out,5000); });
        }).catch(function(err){ showModal('Error', 'Could not read server health: '+(err && err.message||String(err)), 'OK'); });
      });
      // insert before user-name text
      var demo = document.getElementById('demoPill');
      if(demo && demo.parentNode){ demo.parentNode.insertBefore(btn, demo.nextSibling); }
      else container.appendChild(btn);
    }catch(e){}
  }

  // Confirm destructive actions: use native confirm for reliability in this sprint
  function attachConfirmHandlers(){
    document.addEventListener('click', function(ev){
      var el = ev.target.closest && ev.target.closest('.rs-seg-danger, .rs-seg-danger *');
      if(el){
        var ok = window.confirm('Are you sure? This action cannot be undone.');
        if(!ok){ ev.preventDefault(); ev.stopPropagation(); }
        return;
      }
      // ids commonly used for stop/delete
      var stopEl = ev.target.closest && ev.target.closest('#btnStopJob, #btnDeleteJob, .danger-action');
      if(stopEl){ var ok2 = window.confirm('Are you sure you want to stop/delete this job?'); if(!ok2){ ev.preventDefault(); ev.stopPropagation(); } }
    }, true);
  }

  // Expose simple showError for other scripts
  window.uiShowError = function(msg, logUrl){
    showModal('Error', msg || 'An error occurred.').then(function(){ if(logUrl) window.open(logUrl,'_blank'); });
  };

  // Asset version: parse first stylesheet ?v= param and show in footer for dev visibility
  function showAssetVersion(){
    try{
      var links = document.querySelectorAll('link[rel="stylesheet"]');
      for(var i=0;i<links.length;i++){
        var href = links[i].getAttribute('href')||''; var m = href.match(/[?&]v=([^&]+)/);
        if(m){ var ver = m[1]; var f = document.querySelector('.foot-inner'); if(f){ var el = document.createElement('div'); el.style.opacity='.6'; el.style.fontSize='12px'; el.style.marginTop='6px'; el.textContent = 'assets: ' + ver; f.appendChild(el); } break; }
      }
    }catch(e){}
  }

  // Initialization
  document.addEventListener('DOMContentLoaded', function(){ showDemoPillIfNeeded(); createCopyFingerprintBtn(); attachConfirmHandlers(); showAssetVersion(); });

})();
</script>
